<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260000" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Orange Vector Border Gradient -->
    <linearGradient id="orange-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A00" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#CC4400" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bg-grad)" stroke="url(#orange-border)" stroke-width="12" />

  <!-- Inner Subtle Accent Border -->
  <rect x="32" y="32" width="448" height="448" rx="84" ry="84" fill="none" stroke="#FF9A00" stroke-width="2" stroke-opacity="0.3" />

  <!-- Illustrator Text "Ai" -->
  <g fill="#FF9A00" filter="url(#glow)">
    <!-- Letter 'A' -->
    <path d="M 108 348 L 178 160 L 218 160 L 288 348 L 246 348 L 228 296 L 168 296 L 150 348 Z M 178 260 L 218 260 L 198 200 Z" />
    
    <!-- Letter 'i' (Dot and Stem) -->
    <circle cx="338" cy="176" r="22" />
    <rect x="318" y="220" width="40" height="128" rx="6" ry="6" />
  </g>

  <!-- Vector Pen Tool Decorative Node Overlay (Top Right) -->
  <g stroke="#FF9A00" stroke-width="3" opacity="0.4" fill="none">
    <path d="M 380 70 Q 430 70 430 120" stroke-dasharray="4 4" />
    <rect x="374" y="64" width="12" height="12" fill="#FF9A00" />
    <rect x="424" y="114" width="12" height="12" fill="#FF9A00" />
  </g>
</svg>